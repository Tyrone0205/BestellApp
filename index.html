<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BestellApp</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="page-container">

        <!-- HEADER -->
        <header class="site-header">
            <div class="header-content">

                <img class="header-logo" src="./assets/icons/Logo 02.svg" alt="BestellApp Logo">

                <img class="menu-icon" src="./assets/icons/dehaze.svg" alt="" aria-hidden="true">

            </div>
        </header>
        <!-- HERO SECTION -->
        <section class="restaurant-hero" aria-labelledby="restaurant-name">

            <div class="hero-image">
                <img src="./assets/img/hero.jpg" alt="Burger, Pizza und weitere Gerichte auf einem Tisch">
            </div>

            <div class="restaurant-info">

                <img class="restaurant-logo" src="./assets/img/burger_hero.png" alt="BurgerHouse Logo">

                <div class="restaurant-heading">

                    <h1 id="restaurant-name">
                        <span>Burger</span>House
                    </h1>

                    <div class="restaurant-rating" aria-label="Rating: 4.1 out of 5 stars, based on 317 reviews">

                        <span aria-hidden="true">★</span>
                        <span>4,1</span>
                        <span class="rating-count">(317)</span>

                    </div>
                </div>

                <p class="restaurant-description">
                    The best of Burgers, Pizza, and Greens, all in one great place.
                </p>

            </div>

        </section>

        </main>

    </div>
</body>

</html>
