<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BestellApp</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="shortcut icon" href="./assets/icons/Logo 02.svg" type="image/svg">

    <script src="./script.js" defer></script>
    <script src="./scripts/db.js" defer></script>
    <script src="./scripts/template.js" defer></script>
</head>

<body>
    <div class="page-container">

        <!-- HEADER -->
        <header class="site-header">
            <div class="header-content">

                <img class="header-logo" src="./assets/icons/Logo 02.svg" alt="BestellApp Logo">

                <img class="menu-icon" src="./assets/icons/dehaze.svg" alt="" aria-hidden="true">

            </div>
        </header>
        <!-- HERO SECTION -->
        <section class="restaurant-hero" aria-labelledby="restaurant-name">

            <div class="hero-image"></div>

            <div class="restaurant-info">

                <img class="restaurant-logo" src="./assets/img/burger_hero.png" alt="BurgerHouse Logo">

                <div class="restaurant-heading">

                    <h1 id="restaurant-name">
                        <span>Burger</span>House
                    </h1>

                    <div class="restaurant-rating" aria-label="Rating: 4.1 out of 5 stars, based on 317 reviews">

                        <span aria-hidden="true">★</span>
                        <span>4,1</span>
                        <span class="rating-count">(317)</span>

                    </div>
                </div>

                <p class="restaurant-description">
                    The best of Burgers, Pizza, and Greens, all in one great place.
                </p>

            </div>

        </section>

        <!-- SPEISEKARTE UND WARENKORB -->
        <div class="menu-and-basket">

            <!-- SPEISEKARTE -->
            <section class="menu-section" aria-label="Our menu">
                <!-- BURGER & SANDWICHES -->
                <section class="meal-category" aria-labelledby="burger-heading">

                    <div class="meal-category-heading">
                        <div class="meal-category-heading-content">
                            <img src="./assets/img/burger_picture.png" alt="">
                            <h2 id="burger-heading">Burger & Sandwiches</h2>
                        </div>
                    </div>

                    <div id="burger-list" class="meal-list">

                    </div>

                </section>

                <!-- PIZZA -->
                <section class="meal-category" aria-labelledby="pizza-heading">

                    <div class="meal-category-heading">
                        <div class="meal-category-heading-content">
                            <img src="./assets/img/pizza_picture.png" alt="">
                            <h2 id="pizza-heading">Pizza (30cm)</h2>
                        </div>
                    </div>

                    <div id="pizza-list" class="meal-list">

                    </div>
                </section>

                <!-- SALAD -->
                <section class="meal-category" aria-labelledby="salad-heading">
                    <div class="meal-category-heading">
                        <div class="meal-category-heading-content">
                            <img src="./assets/img/salat_picture.png" alt="">
                            <h2 id="salad-heading">Salad</h2>
                        </div>
                    </div>

                    <div id="salad-list" class="meal-list">

                    </div>
                </section>

            </section>

            <!-- STICKY WARENKORB -->
            <aside class="basket-wrapper" aria-labelledby="basket-heading">

                <div class="basket">

                    <h2 id="basket-heading">Your Basket</h2>

                    <div class="basket-empty">
                        <p>
                            Nothing here yet.
                            Go ahead and choose something delicious!
                        </p>

                        <img src="./assets/img/shopping_cart.png" alt="Image of the Shopping-Cart" class="basket-empty-icon">
                    </div>

                </div>

            </aside>

        </div>

        </main>

        <!-- FOOTER -->
        <footer>
            <div class="footer-content">
                <p>© 2025 BurgerHouse</p>

                <a href="./imprint.html">Imprint</a>

                <button type="button">
                    Cookie Preferences
                </button>
            </div>
        </footer>

    </div>
</body>

</html>
